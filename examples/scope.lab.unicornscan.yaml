# Evergreen Covey — signed demo SCOPE for the unicornscan loopback prove.
# Same honesty as examples/scope.lab.yaml: tiles 127.0.0.0/28 into /30s.
# Not a real /8. unicornscan is a TCP SYN sweeper, so prove binds a lab
# TCP listener on 18080 on the first usable host of each /30. Default
# iface is the gateway NIC — loopback tiles need -i lo. A same-IP
# self-scan on lo finds 0; argv sources 127.0.0.254 (still 127/8, not
# in the /28). Parse requires TCP open (not TCP closed).
# Signature is HMAC-SHA256 with the demo key (demo: true).
version: 1
demo: true
consent:
  signed: true
  signer: prove-lab
  purpose: evergreen-covey unicornscan loopback prove
window:
  start: '2026-01-01T00:00:00Z'
  end: '2029-12-31T23:59:59Z'
adapter: unicornscan
max_workers: 2
max_shards: 16
allow_wide: false
tile:
  default_prefix: 24
  small_prefix: 30
pass2:
  ports: '18080'
targets:
- cidr: 127.0.0.0/28
signature: c1b6aad42f096e640add0e85977be733cd004ffa0bdfede415c54362bd5869b6
