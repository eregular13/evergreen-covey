# Evergreen Covey — signed demo SCOPE for the sslscan loopback prove.
# Same honesty as examples/scope.lab.yaml: tiles 127.0.0.0/28 into /30s.
# Not a real /8. sslscan is a TLS probe, so prove serves TLS on 18080
# on the first usable host of each /30. HTTP 200 and bare TCP accept
# are not enough — sslscan prints Connected to only after a handshake.
# Signature is HMAC-SHA256 with the demo key (demo: true).
version: 1
demo: true
consent:
  signed: true
  signer: prove-lab
  purpose: evergreen-covey sslscan loopback prove
window:
  start: '2026-01-01T00:00:00Z'
  end: '2029-12-31T23:59:59Z'
adapter: sslscan
max_workers: 2
max_shards: 16
allow_wide: false
tile:
  default_prefix: 24
  small_prefix: 30
pass2:
  ports: '18080'
targets:
- cidr: 127.0.0.0/28
signature: e0b47a07d27deb419783e03a73fdf72db5228aecb03c98ecdc9573a0a9d0139a
