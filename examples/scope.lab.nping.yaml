# Evergreen Covey — signed demo SCOPE for the nping loopback prove.
# Same honesty as examples/scope.lab.yaml: tiles 127.0.0.0/28 into /30s.
# Not a real /8. nping --tcp-connect is a TCP handshake probe, so prove
# binds a lab TCP listener on 18080 on the first usable host of each /30.
# Raw --icmp/--tcp need root; those modes are not this brick.
# Signature is HMAC-SHA256 with the demo key (demo: true).
version: 1
demo: true
consent:
  signed: true
  signer: prove-lab
  purpose: evergreen-covey nping loopback prove
window:
  start: '2026-01-01T00:00:00Z'
  end: '2029-12-31T23:59:59Z'
adapter: nping
max_workers: 2
max_shards: 16
allow_wide: false
tile:
  default_prefix: 24
  small_prefix: 30
pass2:
  ports: '18080'
targets:
- cidr: 127.0.0.0/28
signature: 34386ed3413e8f43ce79dc7436e03cc8faff13a58913a4abd87c66b41c75320b
